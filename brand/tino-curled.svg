<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" role="img" aria-label="Tino curled up, safe in its shell">
  <title>Tino curled up, safe in its shell</title>
  <style>
    .ink { stroke: #283246; } .ink-fill { fill: #283246; }
    .shell { fill: #5b7db8; } .scale { fill: #6c8bc3; } .band { fill: #8faad9; } .rim { fill: #4e6ea8; }
    .skin { fill: #ebcfaa; } .blush { fill: #f2a99f; } .blush-line { stroke: #f2a99f; }
    .accent { fill: #e8907a; } .accent-dark { fill: #d27560; } .accent-line { stroke: #d27560; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e6e9ee; }
      .shell { fill: #6e8fcb; } .scale { fill: #7f9dd3; } .rim { fill: #5f80bb; }
    }
  </style>
  <defs>
    <clipPath id="tino-ball-clip"><circle cx="104" cy="104" r="72"/></clipPath>
  </defs>
  <ellipse cx="106" cy="184" rx="70" ry="7" fill="#283246" opacity=".08"/>
  <g stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- a three-banded armadillo, rolled up -->
    <circle class="ink shell" cx="104" cy="104" r="72"/>
    <g clip-path="url(#tino-ball-clip)" stroke="none">
      <g class="scale">
        <rect x="56" y="64" width="10" height="10" rx="3"/><rect x="44" y="92" width="10" height="10" rx="3"/>
        <rect x="62" y="118" width="10" height="10" rx="3"/><rect x="50" y="142" width="10" height="10" rx="3"/>
        <rect x="140" y="56" width="10" height="10" rx="3"/><rect x="152" y="84" width="10" height="10" rx="3"/>
        <rect x="160" y="112" width="10" height="10" rx="3"/>
      </g>
      <path class="band" d="M80 26 Q70 104 86 186 L95 186 Q79 104 89 26 Z"/>
      <path class="band" d="M104 26 Q98 104 107 186 L116 186 Q107 104 113 26 Z"/>
      <path class="band" d="M127 26 Q124 104 129 186 L138 186 Q133 104 136 26 Z"/>
    </g>
    <circle class="ink" cx="104" cy="104" r="72" fill="none"/>
    <!-- tucked in: head shield, an ear, eyes closed, content -->
    <g transform="translate(160 158) scale(1.32) translate(-160 -158)">
      <path class="ink skin" d="M150 150 C164 140 182 146 186 160 C188 170 176 178 160 176 C148 174 142 160 150 150 Z"/>
      <path class="ink skin" d="M156 150 C150 132 156 120 165 122 C171 126 168 140 163 150 Z"/>
      <path class="blush-line" d="M159 142 C156 134 158 128 162 128" fill="none" stroke-width="3"/>
      <path class="ink" d="M167 160 Q172 155 177 160" fill="none" stroke-width="2.8"/>
      <ellipse class="blush" cx="179" cy="168" rx="4" ry="2.4" opacity=".8" stroke="none"/>
      <circle class="ink-fill" cx="188" cy="165" r="2.8" stroke="none"/>
    </g>
    <!-- tail, curled over the front -->
    <path class="ink skin" d="M120 178 Q140 186 150 176 Q138 178 126 170 Z"/>
  </g>
</svg>
