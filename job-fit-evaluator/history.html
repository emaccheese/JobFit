<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tracked jobs — JobFit</title>
<link rel="stylesheet" href="ui.css">
<style>
  body {
    margin: 0; padding: 24px 20px 60px;
    font: 14px/1.5 var(--font);
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: var(--fs-xl); margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: var(--fs-sm); margin-bottom: 18px; }

  .controls {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
  input[type="text"] { min-width: 0; }
  /* Small enough that the whole bar stays on one row at a normal window width;
     the Data control was wrapping and costing 60px of vertical space above the
     list, which is the thing the page exists to show. */
  .field-grow { flex: 1; min-width: 140px; }
  .field-grow input { width: 100%; }
  .checkfield {
    display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); padding-bottom: 6px;
    flex: 0 0 auto; white-space: nowrap;
  }

  /* Funnel chips: the page should say what to do next, not just what happened. */
  .funnel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .funnel button {
    display: flex; align-items: baseline; gap: 6px;
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-pill);
    padding: 5px 12px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer;
  }
  .funnel button:hover { border-color: var(--border); }
  .funnel button strong { color: var(--text); font-weight: 600; }
  .funnel button.urgent { border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber-fg); }
  .funnel button.urgent strong { color: var(--amber-fg); }
  .funnel button.urgent[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-fill); }
  .funnel button.urgent[aria-pressed="true"] strong { color: var(--on-fill); }
  .funnel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-fill); }
  .funnel button[aria-pressed="true"] strong { color: var(--on-fill); }

  /* Occasional actions live behind one control instead of a standing panel. */
  .data-menu { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0; margin: 0 0 0 auto; position: relative; background: var(--card); }
  .data-menu > summary {
    cursor: pointer; list-style: none; padding: 6px 12px; font-size: var(--fs-md); font-weight: 400; margin: 0;
  }
  .data-menu > summary::-webkit-details-marker { display: none; }
  .data-menu[open] > summary { border-bottom: 1px solid var(--line); }
  .data-menu-body {
    position: absolute; right: 0; top: 100%; z-index: 5; width: 260px;
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin-top: 4px; box-shadow: var(--shadow-md);
  }
  .data-menu-body .hint { margin: 2px 0 0; line-height: 1.4; }
  .backup-status {
    border-radius: var(--radius-sm); padding: 10px 12px; margin: -8px 0 16px; font-size: var(--fs-sm);
    background: var(--green-soft); color: var(--green-fg); border: 1px solid var(--green-line); white-space: pre-line;
  }
  .backup-status.error { background: var(--red-soft); color: var(--red-fg); border-color: var(--red-line); }
  .backup-status.neutral {
    background: var(--card); color: var(--text); border-color: var(--line);
    font-family: var(--mono); font-size: var(--fs-xs);
    /* pre, not pre-line: the report is a table held together by spaces, and
       pre-line collapses runs of them. */
    white-space: pre; overflow-x: auto;
  }

  .queue { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .queue-actions { display: flex; gap: 8px; }
  .queue-pause { background: var(--amber-soft); color: var(--amber-fg); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 8px; font-size: var(--fs-sm); }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
  .qrow:first-child { border-top: none; }
  .qstate {
    flex: 0 0 auto; font-size: var(--fs-xs); font-weight: 600;
    border-radius: 4px; padding: 1px 7px; background: var(--chip); color: var(--muted);
  }
  .qstate.processing { background: var(--accent-soft); color: var(--accent-fg); }
  .qstate.failed { background: var(--red-soft); color: var(--red-fg); }
  .qstate.done { background: var(--green-soft); color: var(--green-fg); }
  .qtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qerr { color: var(--red-fg); font-size: var(--fs-xs); margin-left: 28px; padding-bottom: 6px; }
  .qrow button { padding: 3px 8px; font-size: var(--fs-xs); }
  .qscore {
    flex: 0 0 auto; min-width: 30px; text-align: center; font-weight: 700; font-size: var(--fs-xs);
    border-radius: 4px; padding: 2px 6px; background: var(--chip); color: var(--muted);
  }
  .qscore.green { background: var(--green-soft); color: var(--green-fg); }
  .qscore.amber { background: var(--amber-soft); color: var(--amber-fg); }
  .qscore.red { background: var(--red-soft); color: var(--red-fg); }

  /* Queue at the top, away from the list: it's status, not something you
     work the list with. The running job is pinned outside the scroll area so
     auto-scrolling to the newest item can never hide what's happening now. */
  .queue-running:empty { display: none; }
  .queue-running .qrow { border-top: none; background: var(--accent-soft); border-radius: var(--radius-sm); padding: 5px 8px; margin-bottom: 4px; }
  .queue-items { max-height: calc(4 * 34px); overflow-y: auto; padding-right: 10px; }
  .queue-items:empty { display: none; }

  /* Filters sit together; the out-of-date chip is on the same row but pushed
     right, so it reads as a notice rather than one more status bucket. */
  .funnel-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .funnel-row .funnel { flex: 1; margin-bottom: 0; }
  .funnel-aside { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding-left: 12px; border-left: 1px solid var(--line); }
  .funnel-aside:not(:has(> :not([hidden]))) { display: none; }
  .dup-chip .stale-open { padding-right: 12px; }
  .badge.badge-dup { background: var(--card); color: var(--amber-fg); border: 1px solid var(--amber-line); }
  .dup-box { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 14px; }
  .dup-box h3 { margin-top: 0; color: var(--amber-fg); }
  .dup-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: var(--fs-sm); }
  .dup-row .dup-what { font-weight: 600; }
  .dup-row .dup-notes { color: var(--muted); font-style: italic; }
  .dup-row button { padding: 3px 9px; font-size: var(--fs-xs); }
  .stale-chip {
    display: inline-flex; align-items: center; border: 1px dashed var(--amber-line); border-radius: var(--radius-pill);
    background: var(--amber-soft); color: var(--amber-fg); font-size: var(--fs-sm); overflow: hidden;
  }
  .stale-chip button { border: none; background: none; color: inherit; border-radius: 0; }
  .stale-chip .stale-open { padding: 5px 4px 5px 12px; }
  .stale-chip .stale-open strong { font-weight: 700; margin-right: 5px; }
  .stale-chip[aria-pressed="true"] { background: var(--amber); border-style: solid; border-color: var(--amber); color: var(--on-fill); }
  .stale-chip .stale-dismiss { padding: 5px 10px 5px 6px; font-size: 15px; line-height: 1; opacity: .75; }
  .stale-chip .stale-dismiss:hover { opacity: 1; background: none; }
  .stale-chip button:hover { background: none; }

  /* Always rendered, fixed height: selecting a row swaps what's inside it
     instead of inserting a bar above the list and shoving every row down. */
  .list-toolbar {
    position: sticky; top: 0; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; background: var(--bg); padding: 6px 2px; margin-bottom: 6px;
    border-bottom: 1px solid var(--line); font-size: var(--fs-sm);
  }
  .lt-left, .lt-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lt-left .count { color: var(--muted); white-space: nowrap; }
  .lt-left .count.selected { color: var(--text); font-weight: 600; }
  .lt-left button, .pager button { padding: 4px 10px; font-size: var(--fs-sm); }
  .lt-left button.link { text-decoration: none; }
  .lt-left button.link:hover { text-decoration: underline; }
  .select-all { margin: 0 2px 0 14px; cursor: pointer; }
  .pager { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .pager select { padding: 3px 6px; font-size: var(--fs-sm); }
  .pager .page-of { min-width: 64px; text-align: center; }
  .queue-pill {
    padding: 3px 10px; font-size: var(--fs-xs); border-radius: var(--radius-pill);
    background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-fg); white-space: nowrap;
  }
  .queue-pill:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  .queue-pill.paused { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-fg); font-weight: 600; }
  .brief-note button { margin-left: 6px; padding: 2px 8px; font-size: var(--fs-xs); }
  .pager-bottom { display: flex; justify-content: flex-end; margin-top: 4px; }
  .pager-bottom:empty { display: none; }
  @media (max-width: 720px) {
    .funnel-row { flex-direction: column; }
    .funnel-aside { border-left: none; padding-left: 0; }
    .pager .per-page { display: none; }
  }
  .select-box { flex: 0 0 auto; margin: 0; cursor: pointer; }
  .select-box:disabled { cursor: default; opacity: .35; }
  .previous-list { display: flex; flex-direction: column; gap: 4px; }
  .previous { border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .previous > summary { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer; font-size: var(--fs-sm); }
  .previous[open] > summary { border-bottom: 1px solid var(--line); }
  .previous-meta { color: var(--muted); }
  .previous-body { padding: 4px 12px 10px; }

  .job {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid transparent;
    border-radius: 8px; margin-bottom: 10px; overflow: hidden;
  }
  /* Status reads from the edge of the row. Score badges keep the green/amber/red
     channel to themselves, so the two signals never compete. */
  .job.st-applied      { border-left-color: var(--accent-line); }
  .job.st-interviewing { border-left-color: var(--accent); }
  .job.st-offer        { border-left-color: var(--green); }
  .job.st-ghosted      { border-left-color: var(--amber-line); }
  .job.st-closed       { border-left-color: transparent; opacity: .62; }
  .job.st-closed:hover, .job.st-closed:focus-within { opacity: 1; }
  /* Brief highlight when arriving from a banner, so the job you asked for is
     obvious among identical-looking rows. */
  .job.flash { box-shadow: 0 0 0 3px var(--accent-line); }
  .job-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .job-head:hover { background: var(--row-hover); }
  .chev { color: var(--muted); font-size: 11px; width: 10px; flex: 0 0 10px; display: inline-block; transition: transform .12s ease; }
  .job.open .chev { transform: rotate(90deg); }
  .score {
    flex: 0 0 46px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: var(--on-fill); background: var(--grey);
  }
  .score.green { background: var(--green); } .score.amber { background: var(--amber); } .score.red { background: var(--red); }
  .job-title { flex: 1; min-width: 0; }
  .job-title strong { display: flex; align-items: center; min-width: 0; font-size: var(--fs-md); white-space: nowrap; }
  .job-title .title-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .job-title strong > :not(.title-text) { flex: 0 0 auto; }
  .copy-name {
    vertical-align: middle; margin-left: 6px; padding: 0 6px; font-size: var(--fs-xs); font-weight: 400; line-height: 18px;
    color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 4px;
  }
  .copy-name:hover:not(:disabled) { color: var(--accent-fg); border-color: var(--accent-line); background: var(--accent-soft); }
  .copy-name.done { color: var(--green-fg); border-color: var(--green-line); }
  .job-title > span { display: block; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    display: inline-block; vertical-align: middle;
    font-size: var(--fs-xs); font-weight: 600;
    background: var(--red-soft); color: var(--red-fg); border-radius: 4px; padding: 1px 6px; margin-left: 6px;
  }
  .badge.badge-muted { background: var(--chip); color: var(--muted); }
  .badge.badge-attention { background: var(--amber-soft); color: var(--amber-fg); }
  .when { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--muted); text-align: right; white-space: nowrap; }
  .job-head select {
    flex: 0 0 auto; max-width: 240px;
    border-color: transparent; background: transparent; color: var(--muted);
    transition: border-color .12s, background .12s, color .12s;
  }
  .job-head:hover select, .job-head select:focus { border-color: var(--control); background: var(--card); color: inherit; }

  .job-body { border-top: 1px solid var(--line); padding: 14px; display: none; }
  .job.open .job-body { display: block; }
  .job-body h3 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .job-body h3:first-child { margin-top: 0; }
  .desc {
    white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px; max-height: 340px; overflow-y: auto; font-size: var(--fs-sm);
  }
  .tag { display: inline-block; font-size: var(--fs-xs); border-radius: 4px; padding: 2px 7px; margin: 0 4px 4px 0; }
  .tag-green { background: var(--green-soft); color: var(--green-fg); }
  .tag-amber { background: var(--amber-soft); color: var(--amber-fg); }
  .tag-red { background: var(--red-soft); color: var(--red-fg); }
  .tag-neutral { background: var(--chip); color: var(--muted); }
  .meta-line { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
  .verdict-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .verdict-line strong { font-size: 18px; }
  .verdict-word { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .brief-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .brief-note { font-size: var(--fs-xs); color: var(--muted); }
  .notes { width: 100%; min-height: 60px; }
  .row-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
  .saved { font-size: var(--fs-xs); color: var(--green-fg); }
  a { word-break: break-all; }
  .empty { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="history.title">Tracked jobs</h1>
    <div class="sub" id="subtitle"></div>

    <div id="queuePanel" class="queue" hidden>
      <div class="queue-head">
        <strong id="queueTitle" data-i18n="queue.title">Queue</strong>
        <div class="queue-actions">
          <button id="queueResume" type="button" hidden data-i18n="queue.resume">Resume</button>
          <button id="queueClear" type="button" data-i18n="queue.clearFinished">Clear finished</button>
        </div>
      </div>
      <div id="queuePause" class="queue-pause" hidden></div>
      <div id="queueRunning" class="queue-running"></div>
      <div id="queueItems" class="queue-items"></div>
    </div>

    <div class="funnel-row">
      <div class="funnel" id="funnel"></div>
      <div class="funnel-aside">
        <div id="dupChip" hidden></div>
        <div id="staleChip" hidden></div>
      </div>
    </div>

    <div class="controls">
      <label class="field">
        <span data-i18n="history.profile">Profile</span>
        <select id="profileSelect"></select>
      </label>
      <label class="field">
        <span data-i18n="history.sortBy">Sort by</span>
        <select id="sortSelect">
          <option value="score-desc" data-i18n="history.sortScoreDesc">Score — high to low</option>
          <option value="score-asc" data-i18n="history.sortScoreAsc">Score — low to high</option>
          <option value="viewed-desc" data-i18n="history.sortViewedDesc">Last activity — newest</option>
          <option value="viewed-asc" data-i18n="history.sortViewedAsc">Last activity — oldest</option>
          <option value="applied-desc" data-i18n="history.sortApplied">Date applied — newest</option>
          <option value="company-asc" data-i18n="history.sortCompany">Company A–Z</option>
          <option value="status" data-i18n="history.sortStatus">Application status</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="history.status">Status</span>
        <select id="statusFilter"></select>
      </label>
      <label class="field field-grow">
        <span data-i18n="history.search">Search</span>
        <input id="search" type="text" placeholder="title, company, or anything in the posting" data-i18n-placeholder="history.searchPlaceholder">
      </label>
      <label class="checkfield"><input id="hideRejects" type="checkbox"> <span data-i18n="history.hideRejects">Hide hard rejects</span></label>
      <details class="data-menu" id="dataMenu">
        <summary data-i18n="history.data">Data</summary>
        <div class="data-menu-body">
          <button id="exportCsv" type="button" data-i18n="history.exportCsv">Export CSV</button>
          <button id="exportData" type="button" data-i18n="history.backup">Back up all data</button>
          <button id="importData" type="button" data-i18n="history.restore">Restore from backup…</button>
          <button id="probeReport" type="button" data-i18n="history.probe">Extraction coverage</button>
          <button id="runWizard" type="button" data-i18n="history.runWizard">Run setup wizard…</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
          <p class="hint" data-i18n="history.backupHint">A backup holds profiles, model settings (never your OpenAI API key) and every tracked job — everything the CSV leaves out. Uninstalling the extension erases all of it.</p>
        </div>
      </details>
    </div>

    <div id="backupStatus" class="backup-status" hidden></div>

    <div class="list-toolbar" id="listToolbar">
      <div class="lt-left" id="toolbarLeft"></div>
      <div class="lt-right">
        <button type="button" id="queuePill" class="queue-pill" hidden></button>
        <div id="pagerTop"></div>
      </div>
    </div>

    <div id="list"></div>

    <div class="pager-bottom" id="pagerBottom"></div>
  </div>

  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/pt.js"></script>
  <script src="i18n.js"></script>
  <script src="geo.js"></script>
  <script src="defaults.js"></script>
  <script src="provider.js"></script>
  <script src="keywords.js"></script>
  <script src="profiles.js"></script>
  <script src="evalstore.js"></script>
  <script src="lmstudio-ui.js"></script>
  <script src="ui-shared.js"></script>
  <script src="backup.js"></script>
  <script src="history.js"></script>
</body>
</html>
