<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracked jobs — Tino</title>
<link rel="stylesheet" href="ui.css">
<style>
  body {
    margin: 0; padding: 20px 20px 60px;
    font: 14px/1.5 var(--font);
  }
  .wrap { max-width: 1340px; margin: 0 auto; }

  /* --- header: what you're looking at, and the page-level actions ---------- */
  .page-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 14px; }
  .page-head h1 { font-size: var(--fs-xl); margin: 0; }
  .profile-picker { display: flex; align-items: center; gap: 8px; }
  .profile-picker label { font-size: var(--fs-sm); color: var(--muted); }
  .profile-picker select { max-width: 260px; }
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* --- filters ----------------------------------------------------------------- */
  /* Funnel chips: the page should say what to do next, not just what happened.
     They're the one status filter; the exact status is under More filters. */
  .funnel-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .funnel { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
  .funnel button {
    display: flex; align-items: baseline; gap: 6px;
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-pill);
    padding: 5px 12px; font-size: var(--fs-sm); color: var(--muted); cursor: pointer;
  }
  .funnel button:hover:not(:disabled) { border-color: var(--border); background: var(--card); }
  .funnel button strong { color: var(--text); font-weight: 600; }
  .funnel button.urgent { border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber-fg); }
  .funnel button.urgent strong { color: var(--amber-fg); }
  .funnel button.urgent[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-fill); }
  .funnel button.urgent[aria-pressed="true"] strong { color: var(--on-fill); }
  .funnel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-fill); }
  .funnel button[aria-pressed="true"] strong { color: var(--on-fill); }
  /* The out-of-date and duplicate chips sit on the same row but apart, so they
     read as notices rather than more status buckets. */
  .funnel-aside { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding-left: 12px; border-left: 1px solid var(--line); }
  .funnel-aside:not(:has(> :not([hidden]))) { display: none; }
  .stale-chip {
    display: inline-flex; align-items: center; border: 1px dashed var(--amber-line); border-radius: var(--radius-pill);
    background: var(--amber-soft); color: var(--amber-fg); font-size: var(--fs-sm); overflow: hidden;
  }
  .stale-chip button { border: none; background: none; color: inherit; border-radius: 0; }
  .stale-chip .stale-open { padding: 5px 4px 5px 12px; }
  .dup-chip .stale-open { padding-right: 12px; }
  .stale-chip .stale-open strong { font-weight: 700; margin-right: 5px; }
  .stale-chip[aria-pressed="true"] { background: var(--amber); border-style: solid; border-color: var(--amber); color: var(--on-fill); }
  .stale-chip .stale-dismiss { padding: 5px 10px 5px 6px; min-width: 28px; font-size: 15px; line-height: 1; opacity: .75; }
  .stale-chip button:hover:not(:disabled) { background: none; opacity: 1; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search input { width: 100%; padding-left: 32px; }
  .search svg { position: absolute; left: 10px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .sort { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
  .menu { position: relative; }
  .menu > summary {
    list-style: none; cursor: pointer; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--card); font-size: var(--fs-md); white-space: nowrap;
  }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu > summary:hover { background: var(--hover); }
  .menu[open] > summary { border-color: var(--accent); }
  .menu-body {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; width: 260px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: var(--shadow-md);
  }
  .menu-body label.field { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); font-weight: 600; }
  .menu-body .check { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }

  .page-status {
    border-radius: var(--radius-sm); padding: 10px 12px; margin: 0 0 12px; font-size: var(--fs-sm);
    background: var(--green-soft); color: var(--green-fg); border: 1px solid var(--green-line); white-space: pre-line;
  }
  .page-status.error { background: var(--red-soft); color: var(--red-fg); border-color: var(--red-line); }

  /* --- queue ------------------------------------------------------------------- */
  .queue { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .queue-actions { display: flex; gap: 8px; }
  .queue-pause { background: var(--amber-soft); color: var(--amber-fg); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 8px; font-size: var(--fs-sm); }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
  .qrow:first-child { border-top: none; }
  .qstate { flex: 0 0 auto; font-size: var(--fs-xs); font-weight: 600; border-radius: 4px; padding: 1px 7px; background: var(--chip); color: var(--muted); }
  .qstate.processing { background: var(--accent-soft); color: var(--accent-fg); }
  .qstate.failed { background: var(--red-soft); color: var(--red-fg); }
  .qstate.done { background: var(--green-soft); color: var(--green-fg); }
  .qtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qerr { color: var(--red-fg); font-size: var(--fs-xs); margin-left: 28px; padding-bottom: 6px; }
  .qrow button { padding: 3px 8px; font-size: var(--fs-xs); }
  .qscore { flex: 0 0 auto; min-width: 30px; text-align: center; font-weight: 700; font-size: var(--fs-xs); border-radius: 4px; padding: 2px 6px; background: var(--chip); color: var(--muted); }
  .qscore.green { background: var(--green-soft); color: var(--green-fg); }
  .qscore.amber { background: var(--amber-soft); color: var(--amber-fg); }
  .qscore.red { background: var(--red-soft); color: var(--red-fg); }
  /* The running job is pinned outside the scroll area so auto-scrolling to the
     newest item can never hide what's happening now. */
  .queue-running:empty { display: none; }
  .queue-running .qrow { border-top: none; background: var(--accent-soft); border-radius: var(--radius-sm); padding: 5px 8px; margin-bottom: 4px; }
  .queue-items { max-height: calc(4 * 34px); overflow-y: auto; padding-right: 10px; }
  .queue-items:empty { display: none; }

  /* --- list and details: side by side on wide screens -------------------------- */
  .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .detail-pane { display: none; }
  @media (min-width: 1100px) {
    .split { grid-template-columns: minmax(460px, 1fr) minmax(460px, 1.05fr); }
    .detail-pane {
      display: block; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overscroll-behavior: contain;
    }
  }
  .pane-empty { padding: 48px 28px; text-align: center; color: var(--muted); }
  .split.no-jobs { grid-template-columns: minmax(0, 1fr); }
  .split.no-jobs .detail-pane { display: none; }

  /* Always rendered, fixed height: selecting rows swaps what's inside it
     instead of inserting a bar above the list and shoving every row down. */
  .list-toolbar {
    position: sticky; top: 0; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; background: var(--bg); padding: 6px 2px; margin-bottom: 6px;
    border-bottom: 1px solid var(--line); font-size: var(--fs-sm);
  }
  .lt-left, .lt-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lt-left .count { color: var(--muted); white-space: nowrap; }
  .lt-left .count.selected { color: var(--text); font-weight: 600; }
  .lt-left button, .pager button { padding: 4px 10px; font-size: var(--fs-sm); }
  .lt-left button.link { text-decoration: none; }
  .lt-left button.link:hover { text-decoration: underline; }
  .select-all { margin: 0 2px 0 12px; width: 16px; height: 16px; cursor: pointer; }
  .pager { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .pager select { padding: 3px 6px; font-size: var(--fs-sm); }
  .pager .page-of { min-width: 64px; text-align: center; }
  .queue-pill {
    padding: 3px 10px; font-size: var(--fs-xs); border-radius: var(--radius-pill);
    background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-fg); white-space: nowrap;
  }
  .queue-pill:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  .queue-pill.paused { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-fg); font-weight: 600; }
  .pager-bottom { display: flex; justify-content: flex-end; margin-top: 4px; }
  .pager-bottom:empty { display: none; }

  /* --- rows ---------------------------------------------------------------------- */
  .job {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid transparent;
    border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  /* Status reads from the edge of the row, and from the status menu's text.
     Score badges keep the green/amber/red channel to themselves. */
  .job.st-applied      { border-left-color: var(--accent-line); }
  .job.st-interviewing { border-left-color: var(--accent); }
  .job.st-offer        { border-left-color: var(--green); }
  .job.st-ghosted      { border-left-color: var(--amber-line); }
  .job.st-closed       { opacity: .62; }
  .job.st-closed:hover, .job.st-closed:focus-within, .job.st-closed.selected { opacity: 1; }
  .job.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .job.flash { box-shadow: 0 0 0 3px var(--accent-line); }
  .job-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .job-head:hover { background: var(--row-hover); }
  .chev { color: var(--muted); font-size: 11px; width: 10px; flex: 0 0 10px; transition: transform .12s ease; }
  .job.open .chev { transform: rotate(90deg); }
  @media (min-width: 1100px) { .chev { display: none; } }
  .select-box { flex: 0 0 auto; margin: 0; width: 16px; height: 16px; cursor: pointer; }
  .select-box:disabled { cursor: default; opacity: .35; }
  .score {
    flex: 0 0 44px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: var(--on-fill); background: var(--grey);
  }
  .score.green { background: var(--green); } .score.amber { background: var(--amber); } .score.red { background: var(--red); }
  .job-title { flex: 1; min-width: 0; }
  .title-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title-btn {
    min-width: 0; padding: 0; border: none; background: none; font-weight: 700; font-size: var(--fs-md);
    text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; border-radius: 3px;
  }
  .title-btn:hover:not(:disabled) { background: none; text-decoration: underline; }
  .title-line > :not(.title-btn) { flex: 0 0 auto; }
  .copy-name {
    padding: 0 7px; min-height: 24px; font-size: var(--fs-xs); font-weight: 400; line-height: 22px;
    color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 4px;
  }
  .copy-name:hover:not(:disabled) { color: var(--accent-fg); border-color: var(--accent-line); background: var(--accent-soft); }
  .copy-name.done { color: var(--green-fg); border-color: var(--green-line); }
  .job-sub { display: block; margin-top: 2px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-sub .badge { margin-right: 2px; }
  .badge {
    display: inline-block; vertical-align: middle; white-space: nowrap;
    font-size: var(--fs-xs); font-weight: 600; border-radius: 4px; padding: 1px 6px;
    background: var(--red-soft); color: var(--red-fg);
  }
  .badge.badge-muted { background: var(--chip); color: var(--muted); }
  .badge.badge-attention { background: var(--amber-soft); color: var(--amber-fg); }
  .badge.badge-dup { background: var(--card); color: var(--amber-fg); border: 1px solid var(--amber-line); }
  .status-select {
    flex: 0 0 auto; max-width: 165px; font-size: var(--fs-sm);
    border-color: transparent; background: transparent; color: var(--muted);
  }
  .job-head:hover .status-select, .status-select:focus-visible, .job.selected .status-select { border-color: var(--control); background: var(--card); color: inherit; }
  .open-link {
    flex: 0 0 auto; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm);
    color: var(--muted); text-decoration: none;
  }
  .open-link:hover { background: var(--hover); color: var(--accent-fg); }
  .open-link svg { width: 16px; height: 16px; }

  /* --- details (the pane, or inline under a row on narrow screens) ------------- */
  .job-body { border-top: 1px solid var(--line); padding: 14px; }
  .details { padding: 18px 20px 24px; }
  .d-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 8px; }
  .d-head .score { flex-basis: 52px; height: 44px; font-size: 18px; }
  .d-head h2 { font-size: 18px; margin: 0; line-height: 1.3; }
  .d-head h2:focus-visible { outline-offset: 3px; border-radius: 4px; }
  .d-sub { font-size: var(--fs-sm); color: var(--muted); }
  .d-links { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 10px 0 4px; font-size: var(--fs-sm); }
  .d-links a { display: inline-flex; align-items: center; gap: 4px; }
  .d-links svg { width: 14px; height: 14px; }
  .d-links .status-select { border-color: var(--control); background: var(--card); color: inherit; max-width: 220px; }
  .d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .details h3, .job-body h3 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 6px; }
  .d-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .d-actions .spacer { flex: 1; }
  .desc {
    white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px; max-height: 340px; overflow-y: auto; font-size: var(--fs-sm);
  }
  .tag { display: inline-block; font-size: var(--fs-xs); border-radius: 4px; padding: 2px 7px; margin: 0 4px 4px 0; }
  .tag-green { background: var(--green-soft); color: var(--green-fg); }
  .tag-amber { background: var(--amber-soft); color: var(--amber-fg); }
  .tag-red { background: var(--red-soft); color: var(--red-fg); }
  .tag-neutral { background: var(--chip); color: var(--muted); }
  .meta-line { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
  .verdict-line { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .verdict-line strong { font-size: 18px; }
  .verdict-word { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .brief-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .brief-note { font-size: var(--fs-xs); color: var(--muted); }
  .brief-note button { margin-left: 6px; padding: 2px 8px; font-size: var(--fs-xs); }
  .notes { width: 100%; min-height: 70px; }
  .saved { font-size: var(--fs-xs); color: var(--green-fg); }
  .previous-list { display: flex; flex-direction: column; gap: 4px; }
  .previous { border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .previous > summary { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer; font-size: var(--fs-sm); }
  .previous[open] > summary { border-bottom: 1px solid var(--line); }
  .previous-meta { color: var(--muted); }
  .previous-body { padding: 4px 12px 10px; }
  .dup-box { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: var(--radius-sm); padding: 10px 12px; margin: 12px 0; }
  .dup-box h3 { margin-top: 0; color: var(--amber-fg); }
  .dup-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: var(--fs-sm); }
  .dup-row .dup-what { font-weight: 600; }
  .dup-row .dup-notes { color: var(--muted); font-style: italic; }
  .dup-row button { padding: 3px 9px; font-size: var(--fs-xs); }
  .company-line {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 12px 0; padding: 8px 12px;
    border: 1px solid var(--amber-line); background: var(--amber-soft); color: var(--amber-fg);
    border-radius: var(--radius-sm); font-size: var(--fs-sm);
  }
  .company-line button.link { font-size: var(--fs-xs); }
  a { word-break: break-word; }

  /* --- empty states, footer, shortcuts ------------------------------------------ */
  .empty { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 36px 28px; text-align: center; color: var(--muted); }
  .empty .empty-tino { display: block; width: 120px; margin: 0 auto 10px; }
  .empty h2 { color: var(--text); font-size: var(--fs-lg); margin: 0 0 8px; }
  .empty p { margin: 0 auto 14px; max-width: 520px; }
  .empty .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .page-foot { margin-top: 18px; text-align: center; font-size: var(--fs-sm); color: var(--muted); }
  kbd {
    font-family: var(--mono); font-size: var(--fs-xs); background: var(--surface-2); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--text);
  }
  dialog.shortcuts {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 0; width: min(440px, calc(100vw - 32px));
    background: var(--card); color: var(--text); box-shadow: var(--shadow-md);
  }
  dialog.shortcuts::backdrop { background: rgba(10, 14, 22, .45); }
  .sc-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .sc-head h2 { font-size: var(--fs-lg); margin: 0; }
  .sc-list { margin: 0; padding: 10px 18px 18px; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; font-size: var(--fs-sm); }
  .sc-list dt { white-space: nowrap; }
  .sc-list dd { margin: 0; }

  @media (max-width: 720px) {
    .funnel-row { flex-direction: column; }
    .funnel-aside { border-left: none; padding-left: 0; }
    .pager .per-page { display: none; }
    .job-head { flex-wrap: wrap; }
    .status-select { max-width: 140px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1 data-i18n="history.title">Tracked jobs</h1>
      <div class="profile-picker">
        <label for="profileSelect" data-i18n="history.profile">Profile</label>
        <select id="profileSelect"></select>
      </div>
      <div class="head-actions">
        <button id="exportCsv" type="button" data-i18n="history.exportCsv">Export CSV</button>
        <button id="openSettings" type="button" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="settings.title">Settings</span>
        </button>
      </div>
    </header>

    <div id="queuePanel" class="queue" hidden>
      <div class="queue-head">
        <strong id="queueTitle" data-i18n="queue.title">Queue</strong>
        <div class="queue-actions">
          <button id="queueResume" type="button" hidden data-i18n="queue.resume">Resume</button>
          <button id="queueClear" type="button" data-i18n="queue.clearFinished">Clear finished</button>
        </div>
      </div>
      <div id="queuePause" class="queue-pause" hidden></div>
      <div id="queueRunning" class="queue-running"></div>
      <div id="queueItems" class="queue-items"></div>
    </div>

    <div class="funnel-row">
      <div class="funnel" id="funnel" role="group" aria-label="Status" data-i18n-aria-label="history.status"></div>
      <div class="funnel-aside">
        <div id="dupChip" hidden></div>
        <div id="staleChip" hidden></div>
      </div>
    </div>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label for="search" class="sr-only" data-i18n="history.search">Search</label>
        <input id="search" type="search" placeholder="title, company, or anything in the posting" data-i18n-placeholder="history.searchPlaceholder">
      </div>
      <label class="sort"><span data-i18n="history.sortBy">Sort by</span>
        <select id="sortSelect">
          <option value="score-desc" data-i18n="history.sortScoreDesc">Score — high to low</option>
          <option value="score-asc" data-i18n="history.sortScoreAsc">Score — low to high</option>
          <option value="viewed-desc" data-i18n="history.sortViewedDesc">Last activity — newest</option>
          <option value="viewed-asc" data-i18n="history.sortViewedAsc">Last activity — oldest</option>
          <option value="applied-desc" data-i18n="history.sortApplied">Date applied — newest</option>
          <option value="company-asc" data-i18n="history.sortCompany">Company A–Z</option>
          <option value="status" data-i18n="history.sortStatus">Application status</option>
        </select>
      </label>
      <details class="menu" id="moreFilters">
        <summary id="moreFiltersLabel" data-i18n="history.moreFilters">More filters</summary>
        <div class="menu-body">
          <label class="field"><span data-i18n="history.exactStatus">Exact status</span>
            <select id="statusFilter"></select>
          </label>
          <label class="check"><input id="hideRejects" type="checkbox"> <span data-i18n="history.hideRejects">Hide hard rejects</span></label>
        </div>
      </details>
    </div>

    <div id="pageStatus" class="page-status" role="status" hidden></div>

    <div class="split">
      <div class="list-col">
        <div class="list-toolbar" id="listToolbar">
          <div class="lt-left" id="toolbarLeft"></div>
          <div class="lt-right">
            <button type="button" id="queuePill" class="queue-pill" hidden></button>
            <div id="pagerTop"></div>
          </div>
        </div>
        <div id="list" aria-label="Tracked jobs" data-i18n-aria-label="history.title"></div>
        <div class="pager-bottom" id="pagerBottom"></div>
      </div>
      <aside class="detail-pane" id="detailPane" aria-label="Job details" data-i18n-aria-label="history.detailsLabel"></aside>
    </div>

    <div class="page-foot">
      <button type="button" class="link" id="showShortcuts"><span data-i18n="history.shortcuts">Keyboard shortcuts</span></button> · <kbd>?</kbd>
    </div>
  </div>

  <dialog class="shortcuts" id="shortcutsDialog" aria-labelledby="shortcutsTitle">
    <div class="sc-head">
      <h2 id="shortcutsTitle" data-i18n="history.shortcuts">Keyboard shortcuts</h2>
      <button type="button" id="closeShortcuts" data-i18n="float.dismiss">Close</button>
    </div>
    <dl class="sc-list" id="shortcutsList"></dl>
  </dialog>

  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/pt.js"></script>
  <script src="i18n.js"></script>
  <script src="geo.js"></script>
  <script src="defaults.js"></script>
  <script src="provider.js"></script>
  <script src="keywords.js"></script>
  <script src="profiles.js"></script>
  <script src="evalstore.js"></script>
  <script src="postingmeta.js"></script>
  <script src="lmstudio-ui.js"></script>
  <script src="ui-shared.js"></script>
  <script src="backup.js"></script>
  <script src="history.js"></script>
</body>
</html>
