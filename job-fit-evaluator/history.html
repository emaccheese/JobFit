<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tracked jobs — JobFit</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --line: #e2e5ea; --text: #1d2330;
    --muted: #616b7c; --accent: #3574d6;
    --green: #1f8a4c; --amber: #b7791f; --red: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .controls {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  select, input[type="text"], textarea {
    font: inherit; padding: 6px 8px; border: 1px solid #ccd2da; border-radius: 5px; background: #fff; color: inherit;
  }
  input[type="text"] { min-width: 0; }
  /* Small enough that the whole bar stays on one row at a normal window width;
     the Data control was wrapping and costing 60px of vertical space above the
     list, which is the thing the page exists to show. */
  .field-grow { flex: 1; min-width: 140px; }
  .field-grow input { width: 100%; }
  .checkfield {
    display: flex; align-items: center; gap: 6px; font-size: 13px; padding-bottom: 6px;
    flex: 0 0 auto; white-space: nowrap;
  }
  button {
    font: inherit; padding: 6px 12px; border: 1px solid #ccd2da; border-radius: 5px;
    background: #fff; color: inherit; cursor: pointer;
  }
  button:hover { background: #f0f2f5; }
  button.danger { color: var(--red); border-color: #e3c0bb; }

  /* Funnel chips: the page should say what to do next, not just what happened. */
  .funnel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .funnel button {
    display: flex; align-items: baseline; gap: 6px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .funnel button:hover { border-color: #c3ccd8; }
  .funnel button strong { color: var(--text); font-weight: 600; }
  .funnel button.urgent { border-color: #e8cfa0; background: #fdf3e2; color: var(--amber); }
  .funnel button.urgent strong { color: var(--amber); }
  .funnel button.urgent[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #fbeacc; }
  .funnel button.urgent[aria-pressed="true"] strong { color: #fff; }
  .funnel button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #dbe7f8; }
  .funnel button[aria-pressed="true"] strong { color: #fff; }

  /* Occasional actions live behind one control instead of a standing panel. */
  .data-menu { border: 1px solid #ccd2da; border-radius: 5px; padding: 0; margin: 0 0 0 auto; position: relative; }
  .data-menu > summary {
    cursor: pointer; list-style: none; padding: 6px 12px; font-size: 14px; font-weight: 400; margin: 0;
  }
  .data-menu > summary::-webkit-details-marker { display: none; }
  .data-menu[open] > summary { border-bottom: 1px solid var(--line); }
  .data-menu-body {
    position: absolute; right: 0; top: 100%; z-index: 5; width: 260px;
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin-top: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.08);
  }
  .data-menu-body .hint { font-size: 11px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
  .backup-status {
    border-radius: 6px; padding: 10px 12px; margin: -8px 0 16px; font-size: 13px;
    background: #e6f4ec; color: var(--green); border: 1px solid #cfe6d9; white-space: pre-line;
  }
  .backup-status.error { background: #fdeceb; color: var(--red); border-color: #f0cfcc; }
  .backup-status.neutral {
    background: var(--card); color: var(--text); border-color: var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    /* pre, not pre-line: the report is a table held together by spaces, and
       pre-line collapses runs of them. */
    white-space: pre; overflow-x: auto;
  }

  .queue { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .queue-actions { display: flex; gap: 8px; }
  .queue-pause { background: #fdf3e2; color: var(--amber); border-radius: 5px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .qrow:first-child { border-top: none; }
  .qstate {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    border-radius: 3px; padding: 2px 6px; background: #eef1f5; color: var(--muted);
  }
  .qstate.processing { background: #eaf1fb; color: var(--accent); }
  .qstate.failed { background: #fdeceb; color: var(--red); }
  .qstate.done { background: #e6f4ec; color: var(--green); }
  .qtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qerr { color: var(--red); font-size: 12px; margin-left: 28px; padding-bottom: 6px; }
  .qrow button { padding: 3px 8px; font-size: 12px; }
  .qscore {
    flex: 0 0 auto; min-width: 30px; text-align: center; font-weight: 700; font-size: 12px;
    border-radius: 4px; padding: 2px 6px; background: #eef1f5; color: var(--muted);
  }
  .qscore.green { background: #e6f4ec; color: var(--green); }
  .qscore.amber { background: #fdf3e2; color: var(--amber); }
  .qscore.red { background: #fdeceb; color: var(--red); }

  /* Queue at the top, away from the list: it's status, not something you
     work the list with. The running job is pinned outside the scroll area so
     auto-scrolling to the newest item can never hide what's happening now. */
  .queue-running:empty { display: none; }
  .queue-running .qrow { border-top: none; background: #f5f8fd; border-radius: 5px; padding: 5px 8px; margin-bottom: 4px; }
  .queue-items { max-height: calc(4 * 34px); overflow-y: auto; padding-right: 10px; }
  .queue-items:empty { display: none; }

  /* Filters sit together; the out-of-date chip is on the same row but pushed
     right, so it reads as a notice rather than one more status bucket. */
  .funnel-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .funnel-row .funnel { flex: 1; margin-bottom: 0; }
  .funnel-aside { flex: 0 0 auto; display: flex; align-items: center; padding-left: 12px; border-left: 1px solid var(--line); }
  .stale-chip {
    display: inline-flex; align-items: center; border: 1px dashed #e0c48d; border-radius: 999px;
    background: #fffaf1; color: var(--amber); font-size: 13px; overflow: hidden;
  }
  .stale-chip button { border: none; background: none; color: inherit; border-radius: 0; }
  .stale-chip .stale-open { padding: 5px 4px 5px 12px; }
  .stale-chip .stale-open strong { font-weight: 700; margin-right: 5px; }
  .stale-chip[aria-pressed="true"] { background: var(--amber); border-style: solid; border-color: var(--amber); color: #fff; }
  .stale-chip .stale-dismiss { padding: 5px 10px 5px 6px; font-size: 15px; line-height: 1; opacity: .7; }
  .stale-chip .stale-dismiss:hover { opacity: 1; background: none; }
  .stale-chip button:hover { background: none; }

  /* Always rendered, fixed height: selecting a row swaps what's inside it
     instead of inserting a bar above the list and shoving every row down. */
  .list-toolbar {
    position: sticky; top: 0; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; background: var(--bg); padding: 6px 2px; margin-bottom: 6px;
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .lt-left, .lt-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lt-left .count { color: var(--muted); white-space: nowrap; }
  .lt-left .count.selected { color: var(--text); font-weight: 600; }
  .lt-left button, .pager button { padding: 4px 10px; font-size: 13px; }
  .lt-left button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lt-left button.link { border: none; background: none; padding: 0; color: var(--accent); }
  .lt-left button.link:hover { text-decoration: underline; background: none; }
  .select-all { margin: 0 2px 0 14px; cursor: pointer; }
  .pager { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .pager select { padding: 3px 6px; font-size: 13px; }
  .pager .page-of { min-width: 64px; text-align: center; }
  .pager-bottom { display: flex; justify-content: flex-end; margin-top: 4px; }
  .pager-bottom:empty { display: none; }
  @media (max-width: 720px) {
    .funnel-row { flex-direction: column; }
    .funnel-aside { border-left: none; padding-left: 0; }
    .pager .per-page { display: none; }
  }
  .select-box { flex: 0 0 auto; margin: 0; cursor: pointer; }
  .select-box:disabled { cursor: default; opacity: .35; }
  .previous-list { display: flex; flex-direction: column; gap: 4px; }
  .previous { border: 1px solid var(--line); border-radius: 6px; }
  .previous > summary { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .previous[open] > summary { border-bottom: 1px solid var(--line); }
  .previous-meta { color: var(--muted); }
  .previous-body { padding: 4px 12px 10px; }
  .badge.badge-stale { text-transform: none; letter-spacing: 0; font-weight: 600; }
  /* A class that sets `display` beats the user agent's [hidden] rule. Applied
     blanket rather than per-class so the next hidden element can't reintroduce
     it — the stale notice was drawing an empty coloured strip while "hidden". */
  [hidden] { display: none !important; }

  .job {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid transparent;
    border-radius: 8px; margin-bottom: 10px; overflow: hidden;
  }
  /* Status reads from the edge of the row. Score badges keep the green/amber/red
     channel to themselves, so the two signals never compete. */
  .job.st-applied      { border-left-color: #9db8e0; }
  .job.st-interviewing { border-left-color: var(--accent); }
  .job.st-offer        { border-left-color: var(--green); }
  .job.st-ghosted      { border-left-color: #e0c48d; }
  .job.st-closed       { border-left-color: transparent; opacity: .62; }
  .job.st-closed:hover { opacity: 1; }
  /* Brief highlight when arriving from a banner, so the job you asked for is
     obvious among identical-looking rows. */
  .job.flash { box-shadow: 0 0 0 3px rgba(53, 116, 214, .35); }
  .job-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .job-head:hover { background: #fafbfc; }
  .chev { color: var(--muted); font-size: 11px; width: 10px; flex: 0 0 10px; display: inline-block; transition: transform .12s ease; }
  .job.open .chev { transform: rotate(90deg); }
  .score {
    flex: 0 0 46px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; background: var(--muted);
  }
  .score.green { background: var(--green); } .score.amber { background: var(--amber); } .score.red { background: var(--red); }
  .job-title { flex: 1; min-width: 0; }
  .job-title strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-title > span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.badge-muted { background: #eef1f5; color: var(--muted); }
  .badge.badge-attention { background: #fdf3e2; color: var(--amber); text-transform: none; letter-spacing: 0; font-weight: 600; }
  .badge {
    display: inline-block; vertical-align: middle;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    background: #fdeceb; color: var(--red); border-radius: 3px; padding: 2px 5px; margin-left: 6px;
  }
  .when { flex: 0 0 auto; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .job-head select {
    flex: 0 0 auto; max-width: 240px;
    border-color: transparent; background: transparent; color: var(--muted);
    transition: border-color .12s, background .12s, color .12s;
  }
  .job-head:hover select, .job-head select:focus { border-color: #ccd2da; background: #fff; color: inherit; }

  .job-body { border-top: 1px solid var(--line); padding: 14px; display: none; }
  .job.open .job-body { display: block; }
  .job-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .job-body h3:first-child { margin-top: 0; }
  .desc {
    white-space: pre-wrap; background: #f7f8fa; border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; max-height: 340px; overflow-y: auto; font-size: 13px;
  }
  .tag { display: inline-block; font-size: 12px; border-radius: 4px; padding: 2px 7px; margin: 0 4px 4px 0; }
  .tag-green { background: #e6f4ec; color: var(--green); }
  .tag-amber { background: #fdf3e2; color: var(--amber); }
  .tag-red { background: #fdeceb; color: var(--red); }
  .tag-neutral { background: #eef1f5; color: var(--muted); }
  .meta-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .verdict-line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .verdict-line strong { font-size: 18px; }
  .verdict-word { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .brief-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .brief-note { font-size: 12px; color: var(--muted); }
  .notes { width: 100%; min-height: 60px; resize: vertical; }
  .row-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
  .saved { font-size: 12px; color: var(--green); }
  a { color: var(--accent); word-break: break-all; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tracked jobs</h1>
    <div class="sub" id="subtitle"></div>

    <div id="queuePanel" class="queue" hidden>
      <div class="queue-head">
        <strong id="queueTitle">Queue</strong>
        <div class="queue-actions">
          <button id="queueResume" type="button" hidden>Resume</button>
          <button id="queueClear" type="button">Clear finished</button>
        </div>
      </div>
      <div id="queuePause" class="queue-pause" hidden></div>
      <div id="queueRunning" class="queue-running"></div>
      <div id="queueItems" class="queue-items"></div>
    </div>

    <div class="funnel-row">
      <div class="funnel" id="funnel"></div>
      <div class="funnel-aside" id="staleChip" hidden></div>
    </div>

    <div class="controls">
      <label class="field">
        <span>Profile</span>
        <select id="profileSelect"></select>
      </label>
      <label class="field">
        <span>Sort by</span>
        <select id="sortSelect">
          <option value="score-desc">Score — high to low</option>
          <option value="score-asc">Score — low to high</option>
          <option value="viewed-desc">Last activity — newest</option>
          <option value="viewed-asc">Last activity — oldest</option>
          <option value="applied-desc">Date applied — newest</option>
          <option value="company-asc">Company A–Z</option>
          <option value="status">Application status</option>
        </select>
      </label>
      <label class="field">
        <span>Status</span>
        <select id="statusFilter"></select>
      </label>
      <label class="field field-grow">
        <span>Search</span>
        <input id="search" type="text" placeholder="title, company, or anything in the posting">
      </label>
      <label class="checkfield"><input id="hideRejects" type="checkbox"> Hide hard rejects</label>
      <details class="data-menu" id="dataMenu">
        <summary>Data</summary>
        <div class="data-menu-body">
          <button id="exportCsv" type="button">Export CSV</button>
          <button id="exportData" type="button">Back up all data</button>
          <button id="importData" type="button">Restore from backup…</button>
          <button id="probeReport" type="button">Extraction coverage</button>
          <button id="runWizard" type="button">Run setup wizard…</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
          <p class="hint">A backup holds profiles, LM Studio settings and every tracked job — everything the CSV leaves out. Uninstalling the extension erases all of it.</p>
        </div>
      </details>
    </div>

    <div id="backupStatus" class="backup-status" hidden></div>

    <div class="list-toolbar" id="listToolbar">
      <div class="lt-left" id="toolbarLeft"></div>
      <div class="lt-right" id="pagerTop"></div>
    </div>

    <div id="list"></div>

    <div class="pager-bottom" id="pagerBottom"></div>
  </div>

  <script src="defaults.js"></script>
  <script src="keywords.js"></script>
  <script src="profiles.js"></script>
  <script src="evalstore.js"></script>
  <script src="lmstudio-ui.js"></script>
  <script src="history.js"></script>
</body>
</html>
