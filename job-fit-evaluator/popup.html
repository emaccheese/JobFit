<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JobFit</title>
<link rel="stylesheet" href="ui.css">
<style>
  /* Status and actions only; every setting lives in Settings (options.html).
     Three blocks in reading order: this job, whether JobFit is ready, and
     where to go next. One primary button at a time. */
  body { width: 360px; margin: 0; padding: 12px 14px 14px; font: 13px/1.45 var(--font); }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .brand { font-size: var(--fs-lg); font-weight: 700; margin: 0; }
  .top .spacer { flex: 1; }
  .icon-btn {
    display: inline-grid; place-items: center; min-width: 32px; min-height: 32px; padding: 0 8px;
    font-size: var(--fs-sm); color: var(--muted); gap: 4px;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .as-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .as-row label { color: var(--muted); white-space: nowrap; font-size: var(--fs-xs); }
  .as-row select { flex: 1; min-width: 0; padding: 5px 8px; }

  .callout { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: var(--fs-xs); }
  .callout.warn { background: var(--amber-soft); border: 1px solid var(--amber-line); }
  .callout button { flex: 0 0 auto; padding: 4px 10px; font-size: var(--fs-xs); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
  .panel-title { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  .line { display: flex; align-items: flex-start; gap: 8px; }
  .line + .line { margin-top: 6px; }
  .dot { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--border); }
  .dot.ok { background: var(--green); }
  .dot.warn { background: var(--amber); }
  .dot.bad { background: var(--red); }
  .line .text { flex: 1; min-width: 0; }
  .line .fix { flex: 0 0 auto; font-size: var(--fs-xs); }

  /* The saved result for the job in this tab. */
  .record { display: flex; gap: 10px; align-items: center; margin: 10px 0 2px; }
  .score {
    flex: 0 0 auto; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    font-size: var(--fs-lg); font-weight: 800; color: var(--on-fill); background: var(--grey);
  }
  .score.green { background: var(--green); } .score.amber { background: var(--amber); } .score.red { background: var(--red); }
  .record .what { min-width: 0; flex: 1; }
  .record .verdict { font-weight: 700; font-size: var(--fs-md); }
  .record .vword { display: inline-block; }
  .record .vword::first-letter { text-transform: uppercase; }
  .record .job-name { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-meta { font-size: var(--fs-xs); color: var(--muted); margin: 4px 0 0; }
  .record-meta .stale { color: var(--amber-fg); font-weight: 600; }
  .record-link { font-size: var(--fs-xs); margin-top: 4px; }
  /* Your history at the company: a heads-up, quieter than an error. */
  .company-note {
    margin: 10px 0 0; padding: 6px 9px; border-radius: var(--radius-sm); font-size: var(--fs-xs);
    background: var(--amber-soft); color: var(--amber-fg); border: 1px solid var(--amber-line);
  }

  .buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .buttons .pair { display: flex; gap: 6px; }
  .buttons .pair > * { flex: 1; }
  .buttons button { width: 100%; }
  .float-toggle { display: flex; align-items: flex-start; gap: 7px; margin-top: 10px; font-size: var(--fs-xs); cursor: pointer; }
  .float-toggle input { margin: 1px 0 0; flex: 0 0 auto; }

  .summary textarea { width: 100%; margin-top: 6px; font-size: var(--fs-xs); }
  .summary .copy-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .note { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
  .note:empty { display: none; }
  .error { color: var(--red-fg); }

  .queue-link { border: none; background: none; padding: 0; color: var(--accent-fg); text-align: left; font-size: var(--fs-xs); cursor: pointer; }
  .queue-link:hover:not(:disabled) { background: none; text-decoration: underline; }
  .foot { display: flex; flex-direction: column; gap: 6px; }
  .foot button { width: 100%; }
  .tip { font-size: var(--fs-xs); color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header class="top">
    <h1 class="brand">JobFit</h1>
    <span class="spacer"></span>
    <button type="button" class="icon-btn" id="openSettings" title="Settings" aria-label="Settings" data-i18n-title="settings.title" data-i18n-aria-label="settings.title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="as-row">
    <label for="profileSelect" data-i18n="popup.evaluatingAs">Evaluating as</label>
    <select id="profileSelect"></select>
  </div>

  <div class="callout warn" id="setupBanner" hidden>
    <span id="setupBannerText"></span>
    <button id="setupContinue" class="primary" type="button" data-i18n="popup.continueSetup">Continue setup</button>
  </div>
  <div class="callout warn" id="cvMissing" hidden>
    <span data-i18n="popup.noCv">This profile has no CV summary yet, so scores won't mean much.</span>
    <button id="addCv" type="button" data-i18n="popup.addInSettings">Add it in Settings</button>
  </div>

  <!-- This job -->
  <section class="panel" aria-labelledby="jobTitle">
    <h2 class="panel-title" id="jobTitle" data-i18n="popup.thisJob">This job</h2>
    <div class="line"><span class="dot" id="pageDot" aria-hidden="true"></span><span class="text" id="pageState" data-i18n="popup.checkingTab">Checking this tab…</span></div>

    <div id="record" hidden>
      <div class="record">
        <span class="score" id="recScore" aria-hidden="true"></span>
        <div class="what">
          <span class="verdict" id="recVerdict"></span>
          <div class="job-name" id="recName"></div>
        </div>
      </div>
      <p class="record-meta" id="recMeta"></p>
      <button type="button" class="link record-link" id="openRecord" data-i18n="popup.openInTracked">Open in Tracked jobs</button>
    </div>
    <p class="company-note" id="companyNote" hidden></p>

    <div class="buttons">
      <button id="evaluate" class="primary" type="button" data-i18n="popup.evaluate">Evaluate this tab</button>
      <div class="pair">
        <button id="reevaluate" type="button" hidden data-i18n="banner.reevaluate">Re-evaluate</button>
        <button id="summarizeTab" type="button" data-i18n="popup.summarize">Summarize this tab</button>
      </div>
    </div>
    <div class="summary">
      <div class="note" id="summarizeStatus" role="status" aria-live="polite"></div>
      <label for="summarizeResult" class="sr-only" data-i18n="popup.summaryLabel">Summary</label>
      <textarea id="summarizeResult" rows="7" readonly hidden></textarea>
      <div class="copy-row"><button id="copySummary" type="button" hidden data-i18n="common.copy">Copy</button></div>
    </div>

    <label class="float-toggle" id="floatRow" hidden>
      <input id="floatToggle" type="checkbox" aria-describedby="floatHint">
      <span id="floatLabel"></span>
    </label>
    <div class="note" id="floatHint" role="status" aria-live="polite"></div>
    <div class="note error" id="status" role="alert"></div>
  </section>

  <!-- Readiness -->
  <section class="panel" aria-labelledby="readyTitle">
    <h2 class="panel-title" id="readyTitle" data-i18n="popup.ready">Ready?</h2>
    <div class="line">
      <span class="dot" id="modelDot" aria-hidden="true"></span>
      <span class="text" id="modelState" data-i18n="popup.checkingModel">Checking the model…</span>
      <button type="button" class="link fix" id="fixModel" hidden data-i18n="popup.fixInSettings">Fix in Settings</button>
    </div>
    <div class="line" id="queueRow" hidden>
      <span class="dot" id="queueDot" aria-hidden="true"></span>
      <button type="button" class="queue-link text" id="queueStatus"></button>
    </div>
  </section>

  <div class="foot">
    <button id="viewHistory" type="button" data-i18n="popup.viewHistory">View tracked jobs</button>
    <div class="tip" id="evaluateTip"></div>
  </div>

  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/pt.js"></script>
  <script src="i18n.js"></script>
  <script src="geo.js"></script>
  <script src="defaults.js"></script>
  <script src="vault.js"></script>
  <script src="provider.js"></script>
  <script src="keywords.js"></script>
  <script src="profiles.js"></script>
  <script src="evalstore.js"></script>
  <script src="postingmeta.js"></script>
  <script src="lmstudio-ui.js"></script>
  <script src="ui-shared.js"></script>
  <script src="inject.js"></script>
  <script src="boards.js"></script>
  <script src="popup.js"></script>
</body>
</html>
