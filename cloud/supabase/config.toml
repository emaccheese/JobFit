# Tino Cloud's local Supabase settings (supabase start). Only what differs
# from the CLI's defaults is here; see cloud/README.md.
project_id = "tino"

[auth]
site_url = "https://emaccheese.github.io/JobFit/"
# The extension signs in with chrome.identity.launchWebAuthFlow, which
# returns to https://<extension id>.chromiumapp.org/.
additional_redirect_urls = ["https://*.chromiumapp.org/**"]
enable_signup = true

# The other way in: a 6-digit code sent by email, typed into the extension.
# No passwords, and no links (a link would open a web page, not the
# extension). The templates below put the code ({{ .Token }}) in the email.
# Supabase's own mailer sends only a few emails an hour; for real use, set an
# SMTP provider (Resend, Postmark…) in the project's Auth settings.
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# A new address gets the confirmation email, a returning one the "magic link"
# email; both carry the code.
[auth.email.template.confirmation]
subject = "Your Tino code / Tu código de Tino"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.magic_link]
subject = "Your Tino code / Tu código de Tino"
content_path = "./supabase/templates/sign-in-code.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Called by the payment provider, which has no Supabase session: the function
# checks the provider's signature instead.
[functions.billing-webhook]
verify_jwt = false
